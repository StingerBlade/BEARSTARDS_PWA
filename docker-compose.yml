# Levanta la PWA completa: base de datos + Django con la PWA.
#   docker compose up --build
# Abrir http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bearstards
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
     
      DEBUG: "False"
      SECRET_KEY: contrasena
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@db:5432/bearstards
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: