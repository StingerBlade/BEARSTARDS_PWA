name: Docker CI

# Comprueba que la imagen de Docker se construye y arranca antes de que
# llegue a main (Render la construye en cada deploy).
# Sin filtro de rutas a proposito (ver frontend-ci.yml): asi el check
# siempre reporta y se puede marcar como obligatorio.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    # Postgres temporal para que el contenedor pueda correr migrate.
    # El CI NUNCA se conecta a Supabase.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bearstards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bearstards:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar el contenedor (como en Render)
        run: |
          docker run -d --name bearstards --network host \
            -e PORT=10000 \
            -e SECRET_KEY=ci-only-insecure-key \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/bearstards \
            bearstards:ci

      - name: Esperar a que responda /api/health/
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:10000/api/health/; then
              echo
              echo "La API responde."
              exit 0
            fi
            sleep 2
          done
          echo "El contenedor no respondio en 60 s."
          exit 1

      - name: Revisar que sirve la PWA
        run: curl -fsS http://localhost:10000/ | grep -q '<div id="root">'

      - name: Logs del contenedor
        if: always()
        run: docker logs bearstards